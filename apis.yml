aid: built
name: Built
description: >-
  Built (Built Technologies) is an AI-powered real estate and construction
  finance platform that connects capital and information across the construction
  lending ecosystem. It serves banks, credit unions, private credit firms,
  owners, developers, and general contractors with construction loan
  administration, deal origination and underwriting, project financials, invoice
  and lien-waiver management, compliance tracking, and payments. Founded over a
  decade ago and headquartered in Nashville and New York, Built operates on one
  of the largest connected datasets in real estate finance and integrates with
  Procore, Sage Intacct, Yardi, QuickBooks, Encompass, nCino, and DocuSign. It
  is backed by Fifth Wall and Index Ventures. This profile was enriched from
  Built's public developer and trust surfaces; Built publishes an integrations
  directory, identity/SSO, a status page, and a trust center, but does not
  expose a public REST API or OpenAPI.
